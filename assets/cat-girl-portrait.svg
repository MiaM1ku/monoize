  <circle cx="572" cy="223" r="5" fill="#F3E1C6"/>

  <use xlink:href="#la-flower" transform="translate(1.5 0)"  stroke="#E0432E" opacity="0.5"/>
  <use xlink:href="#la-flower" transform="translate(-1.5 0)" stroke="#3F7CC4" opacity="0.5"/>
  <use xlink:href="#la-flower" stroke="#8C93A0"/>
</svg>
