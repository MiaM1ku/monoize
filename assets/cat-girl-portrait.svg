<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 800" width="800" height="800" role="img"
     aria-label="Hand-drawn anime portrait of a white-haired cat girl in a sailor uniform">

  <defs>
    <!-- Halftone dot patterns: the dot pitch and radius differ per surface so the
         screens visibly clash, which is what gives the vintage-print moire feel. -->
    <pattern id="dotsRed" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <circle cx="7" cy="7" r="2.7" fill="#B23320"/>
    </pattern>
    <pattern id="dotsBlue" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <circle cx="6" cy="6" r="2.2" fill="#4C84B2"/>
    </pattern>
    <pattern id="dotsPeach" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="4.5" cy="4.5" r="1.9" fill="#EE9668"/>
    </pattern>
    <pattern id="dotsCream" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <circle cx="12" cy="12" r="1.6" fill="#E0D2B6"/>
    </pattern>
    <pattern id="dotsNavy" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="5.5" cy="5.5" r="1.8" fill="#16294C"/>
    </pattern>

    <radialGradient id="irisBlue" cx="0.5" cy="0.62" r="0.65">
      <stop offset="0"    stop-color="#CFF0FC"/>
      <stop offset="0.35" stop-color="#7CC3E8"/>
      <stop offset="0.7"  stop-color="#3E7FC0"/>
      <stop offset="1"    stop-color="#24548F"/>
    </radialGradient>
    <radialGradient id="cheekGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#F4AE83" stop-opacity="0.9"/>
      <stop offset="1"   stop-color="#F4AE83" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="1"   stop-color="#EEF2F6"/>
    </linearGradient>

    <!-- Line-art groups are referenced three times each (red ghost, blue ghost,
         main ink) to fake chromatic aberration from a misregistered print run.
         Paths here carry no stroke color so each <use> can inject its own. -->
    <g id="la-body" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 380 556 C 372 568 352 576 316 590 C 224 622 176 692 170 800" stroke-width="5"/>
      <path d="M 420 556 C 428 568 448 576 484 590 C 576 622 624 692 630 800" stroke-width="5"/>
      <path d="M 372 482 C 372 520 370 544 364 556" stroke-width="4"/>
      <path d="M 428 482 C 428 520 430 544 436 556" stroke-width="4"/>
      <path d="M 376 558 C 328 576 284 600 254 634 C 274 656 296 680 314 708 C 350 686 382 656 400 618 C 392 596 382 576 376 558 Z" stroke-width="5"/>
      <path d="M 424 558 C 472 576 516 600 546 634 C 526 656 504 680 486 708 C 450 686 418 656 400 618 C 408 596 418 576 424 558 Z" stroke-width="5"/>
      <path d="M 400 604 L 376 640 L 400 674 L 424 640 Z" stroke-width="4.5"/>
      <path d="M 388 664 C 372 704 366 744 372 786" stroke-width="4.5"/>
      <path d="M 412 664 C 428 704 434 744 428 786" stroke-width="4.5"/>
      <path d="M 372 786 C 390 796 410 796 428 786" stroke-width="4.5"/>
    </g>

    <g id="la-face" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 297 360 C 299 396 308 428 332 452 C 352 480 374 496 400 496 C 426 496 448 480 468 452 C 492 428 501 396 503 360" stroke-width="5"/>
      <path d="M 306 356 Q 336 344 364 354" stroke-width="4.5"/>
      <path d="M 436 354 Q 464 344 494 356" stroke-width="4.5"/>
      <path d="M 398 443 Q 403 447 400 452" stroke-width="3"/>
      <path d="M 384 466 Q 400 478 416 466" stroke-width="4"/>
    </g>

    <g id="la-hair" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 288 470 C 270 424 258 366 262 302 C 266 220 324 166 400 164 C 476 166 534 220 538 302 C 542 366 530 424 512 470 L 502 432 L 492 464 L 483 428 C 480 402 484 374 488 350 L 478 388 L 466 352 L 455 390 L 443 350 L 432 388 L 419 351 L 407 400 L 394 352 L 381 400 L 368 352 L 357 389 L 345 350 L 334 386 L 324 348 C 318 351 314 354 312 358 C 309 394 306 420 302 436 L 293 428 L 288 470 Z" stroke-width="5"/>
      <path d="M 396 166 C 386 128 412 112 428 128 C 410 124 400 140 406 165" stroke-width="4"/>
      <path d="M 330 206 C 312 236 302 274 300 312" stroke-width="3"/>
      <path d="M 470 206 C 488 236 498 274 500 312" stroke-width="3"/>
      <path d="M 372 340 L 362 300" stroke-width="3"/>
      <path d="M 428 338 L 436 298" stroke-width="3"/>
      <path d="M 348 348 L 342 314" stroke-width="2.5"/>
      <path d="M 452 348 L 458 314" stroke-width="2.5"/>
    </g>

    <g id="la-ears" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 268 262 C 250 214 246 168 254 128 C 292 150 324 180 344 214" stroke-width="5"/>
      <path d="M 276 246 C 264 212 261 180 266 152 C 292 170 314 192 328 214" stroke-width="3.5"/>
      <path d="M 532 262 C 550 214 554 168 546 128 C 508 150 476 180 456 214" stroke-width="5"/>
      <path d="M 524 246 C 536 212 539 180 534 152 C 508 170 486 192 472 214" stroke-width="3.5"/>
    </g>

    <g id="la-ribbon" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 538 266 C 528 238 534 216 552 210 C 566 206 574 220 568 236 C 562 252 552 262 538 266 Z" stroke-width="4"/>
      <path d="M 542 270 C 570 258 592 260 598 274 C 602 288 588 298 570 292 C 558 288 548 280 542 270 Z" stroke-width="4"/>
      <path d="M 528 262 C 538 254 550 256 554 266 C 558 278 550 288 538 288 C 526 288 522 270 528 262 Z" stroke-width="4"/>
      <path d="M 534 286 C 538 314 532 344 514 368 C 528 346 528 316 526 292" stroke-width="4"/>
      <path d="M 546 286 C 560 312 566 342 560 372 C 574 338 568 306 556 284" stroke-width="4"/>
    </g>

    <g id="la-flower" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 572 222 C 564 200 564 176 574 158 C 584 174 586 200 578 222 Z" stroke-width="3"/>
      <path d="M 572 222 C 564 200 564 176 574 158 C 584 174 586 200 578 222 Z" transform="rotate(-38 572 222)" stroke-width="3"/>
      <path d="M 572 222 C 564 200 564 176 574 158 C 584 174 586 200 578 222 Z" transform="rotate(38 572 222)" stroke-width="3"/>
      <path d="M 572 222 C 564 200 564 176 574 158 C 584 174 586 200 578 222 Z" transform="rotate(-76 572 222)" stroke-width="3"/>
      <path d="M 572 222 C 564 200 564 176 574 158 C 584 174 586 200 578 222 Z" transform="rotate(76 572 222)" stroke-width="3"/>
    </g>
  </defs>

  <!-- ===== background ===== -->
  <rect x="0" y="0" width="800" height="800" fill="#F4ECDC"/>
  <rect x="0" y="0" width="800" height="800" fill="url(#dotsCream)" opacity="0.55"/>

  <!-- diagonal sky-blue brushstrokes -->
  <g>
    <path d="M -20 268 C 40 210 120 130 208 66 C 224 84 236 100 244 118 C 160 180 84 252 24 316 C 8 300 -8 284 -20 268 Z" fill="#7EB5DA"/>
    <path d="M -20 268 C 40 210 120 130 208 66 C 224 84 236 100 244 118 C 160 180 84 252 24 316 C 8 300 -8 284 -20 268 Z" fill="url(#dotsBlue)" opacity="0.7"/>
    <path d="M 226 44 C 240 32 254 22 268 14 C 274 22 279 30 283 39 C 269 48 256 58 244 68 C 238 60 232 52 226 44 Z" fill="#7EB5DA"/>
    <path d="M 60 344 C 72 332 84 322 97 312 C 102 319 107 327 111 335 C 98 345 86 356 75 367 C 70 359 65 351 60 344 Z" fill="#7EB5DA" opacity="0.85"/>

    <path d="M 556 812 C 620 748 700 668 788 604 C 800 620 810 640 816 658 C 730 720 650 792 590 852 C 578 838 566 826 556 812 Z" fill="#7EB5DA"/>
    <path d="M 556 812 C 620 748 700 668 788 604 C 800 620 810 640 816 658 C 730 720 650 792 590 852 C 578 838 566 826 556 812 Z" fill="url(#dotsBlue)" opacity="0.7"/>
    <path d="M 700 570 C 714 558 728 548 742 540 C 748 548 753 556 757 565 C 743 574 730 584 718 594 C 712 586 706 578 700 570 Z" fill="#7EB5DA"/>
  </g>

  <!-- red circle with halftone screen; the offset blue ghost circle underneath
