  <circle cx="391" cy="337" r="246" fill="#7EB5DA" opacity="0.4"/>
  <circle cx="400" cy="330" r="245" fill="#D9452F"/>
  <circle cx="400" cy="330" r="245" fill="url(#dotsRed)" opacity="0.65"/>

  <!-- ===== torso and uniform (lifted so the visible neck stays short) ===== -->
  <g transform="translate(0 -12)">
    <path d="M 170 800 C 176 692 224 622 316 590 C 352 576 372 568 380 556 L 420 556 C 428 568 448 576 484 590 C 576 622 624 692 630 800 Z" fill="#FFFFFF"/>
    <path d="M 316 590 C 294 638 282 700 280 800 L 310 800 C 310 716 318 654 334 602 Z" fill="#E7E4DA" opacity="0.6"/>
    <path d="M 484 590 C 506 638 518 700 520 800 L 490 800 C 490 716 482 654 466 602 Z" fill="#E7E4DA" opacity="0.6"/>
  </g>

  <!-- neck -->
  <path d="M 372 440 C 372 510 370 542 362 558 C 386 574 414 574 438 558 C 430 542 428 510 428 440 Z" fill="#FBEBDC"/>
  <path d="M 374 470 C 374 496 382 512 400 516 C 418 512 426 496 426 470 C 412 492 388 492 374 470 Z" fill="#EFC5A4" opacity="0.7"/>

  <g transform="translate(0 -12)">
    <!-- sailor collar -->
    <path d="M 376 558 C 328 576 284 600 254 634 C 274 656 296 680 314 708 C 350 686 382 656 400 618 C 392 596 382 576 376 558 Z" fill="#1F3A66"/>
    <path d="M 424 558 C 472 576 516 600 546 634 C 526 656 504 680 486 708 C 450 686 418 656 400 618 C 408 596 418 576 424 558 Z" fill="#1F3A66"/>
    <path d="M 376 558 C 328 576 284 600 254 634 C 274 656 296 680 314 708 C 350 686 382 656 400 618 C 392 596 382 576 376 558 Z" fill="url(#dotsNavy)" opacity="0.35"/>
    <path d="M 424 558 C 472 576 516 600 546 634 C 526 656 504 680 486 708 C 450 686 418 656 400 618 C 408 596 418 576 424 558 Z" fill="url(#dotsNavy)" opacity="0.35"/>
    <!-- white collar stripes -->
    <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
      <path d="M 378 574 C 336 590 297 612 271 642 C 288 661 305 681 320 704"/>
      <path d="M 382 590 C 345 604 312 623 289 649 C 301 663 313 678 324 694"/>
      <path d="M 422 574 C 464 590 503 612 529 642 C 512 661 495 681 480 704"/>
      <path d="M 418 590 C 455 604 488 623 511 649 C 499 663 487 678 476 694"/>
    </g>

    <!-- necktie -->
    <path d="M 400 604 L 376 640 L 400 674 L 424 640 Z" fill="#1F3A66"/>
    <path d="M 388 664 C 372 704 366 744 372 786 C 390 796 400 796 400 790 L 400 674 Z" fill="#1F3A66"/>
    <path d="M 412 664 C 428 704 434 744 428 786 C 410 796 400 796 400 790 L 400 674 Z" fill="#24406E"/>
    <path d="M 400 604 L 376 640 L 400 674 L 424 640 Z" fill="url(#dotsNavy)" opacity="0.3"/>

    <use xlink:href="#la-body" transform="translate(1.5 0)"  stroke="#E0432E" opacity="0.55"/>
    <use xlink:href="#la-body" transform="translate(-1.5 0)" stroke="#3F7CC4" opacity="0.55"/>
    <use xlink:href="#la-body" stroke="#2B3A56"/>
  </g>

  <!-- ===== face ===== -->
  <path d="M 296 310 C 296 235 340 192 400 192 C 460 192 504 235 504 310 C 504 368 496 412 468 452 C 448 480 426 496 400 496 C 374 496 352 480 332 452 C 304 412 296 368 296 310 Z" fill="#FBEBDC"/>

  <!-- blush -->
  <ellipse cx="313" cy="436" rx="30" ry="14" fill="url(#cheekGlow)"/>
  <ellipse cx="487" cy="436" rx="30" ry="14" fill="url(#cheekGlow)"/>
  <ellipse cx="313" cy="436" rx="26" ry="12" fill="url(#dotsPeach)" opacity="0.9"/>
  <ellipse cx="487" cy="436" rx="26" ry="12" fill="url(#dotsPeach)" opacity="0.9"/>

  <!-- eyes -->
  <g>
    <!-- sclera bounded by the lash line above and the lower lid below -->
    <path d="M 305 392 C 318 370 350 364 371 379 C 374 402 370 430 361 445 C 346 452 329 451 317 445 C 308 430 303 410 305 392 Z" fill="#FFFFFF"/>
    <path d="M 495 392 C 482 370 450 364 429 379 C 426 402 430 430 439 445 C 454 452 471 451 483 445 C 492 430 497 410 495 392 Z" fill="#FFFFFF"/>

    <ellipse cx="338" cy="410" rx="28" ry="35" fill="url(#irisBlue)"/>
    <path d="M 310 406 C 314 384 327 376 338 376 C 349 376 362 384 366 406 C 357 395 348 391 338 391 C 328 391 319 395 310 406 Z" fill="#1C3F70" opacity="0.5"/>
    <ellipse cx="338" cy="414" rx="10.5" ry="14.5" fill="#132A4C"/>
    <circle cx="326" cy="395" r="9" fill="#FFFFFF"/>
    <circle cx="351" cy="427" r="4.5" fill="#FFFFFF" opacity="0.92"/>
    <path d="M 350 388 L 352.5 394.5 L 358.5 397 L 352.5 399.5 L 350 406 L 347.5 399.5 L 341.5 397 L 347.5 394.5 Z" fill="#FFFFFF"/>

    <ellipse cx="462" cy="410" rx="28" ry="35" fill="url(#irisBlue)"/>
    <path d="M 434 406 C 438 384 451 376 462 376 C 473 376 486 384 490 406 C 481 395 472 391 462 391 C 452 391 443 395 434 406 Z" fill="#1C3F70" opacity="0.5"/>
    <ellipse cx="462" cy="414" rx="10.5" ry="14.5" fill="#132A4C"/>
    <circle cx="450" cy="395" r="9" fill="#FFFFFF"/>
    <circle cx="475" cy="427" r="4.5" fill="#FFFFFF" opacity="0.92"/>
    <path d="M 474 388 L 476.5 394.5 L 482.5 397 L 476.5 399.5 L 474 406 L 471.5 399.5 L 465.5 397 L 471.5 394.5 Z" fill="#FFFFFF"/>
  </g>

  <!-- eyelashes: three offset copies for the aberration fringe -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#E0432E" opacity="0.5" transform="translate(1.5 0)">
      <path d="M 302 392 C 316 368 350 362 372 378" stroke-width="9.5"/>
      <path d="M 498 392 C 484 368 450 362 428 378" stroke-width="9.5"/>
    </g>
    <g stroke="#3F7CC4" opacity="0.5" transform="translate(-1.5 0)">
      <path d="M 302 392 C 316 368 350 362 372 378" stroke-width="9.5"/>
      <path d="M 498 392 C 484 368 450 362 428 378" stroke-width="9.5"/>
    </g>
    <g stroke="#1E2F4F">
      <path d="M 302 392 C 316 368 350 362 372 378" stroke-width="9.5"/>
      <path d="M 302 392 L 292 382" stroke-width="7"/>
      <path d="M 498 392 C 484 368 450 362 428 378" stroke-width="9.5"/>
      <path d="M 498 392 L 508 382" stroke-width="7"/>
    </g>
    <path d="M 312 376 C 324 362 348 358 366 366" stroke="#D9A88E" stroke-width="2.5"/>
    <path d="M 488 376 C 476 362 452 358 434 366" stroke="#D9A88E" stroke-width="2.5"/>
    <path d="M 315 446 Q 338 454 361 446" stroke="#C98E7B" stroke-width="3.5"/>
    <path d="M 439 446 Q 462 454 485 446" stroke="#C98E7B" stroke-width="3.5"/>
  </g>

  <use xlink:href="#la-face" transform="translate(1.5 0)"  stroke="#E0432E" opacity="0.55"/>
  <use xlink:href="#la-face" transform="translate(-1.5 0)" stroke="#3F7CC4" opacity="0.55"/>
  <use xlink:href="#la-face" stroke="#2B3A56"/>

  <!-- ===== hair ===== -->
  <path d="M 288 470 C 270 424 258 366 262 302 C 266 220 324 166 400 164 C 476 166 534 220 538 302 C 542 366 530 424 512 470 L 502 432 L 492 464 L 483 428 C 480 402 484 374 488 350 L 478 388 L 466 352 L 455 390 L 443 350 L 432 388 L 419 351 L 407 400 L 394 352 L 381 400 L 368 352 L 357 389 L 345 350 L 334 386 L 324 348 C 318 351 314 354 312 358 C 309 394 306 420 302 436 L 293 428 L 288 470 Z" fill="url(#hairShine)"/>
  <!-- ahoge -->
  <path d="M 396 166 C 386 128 412 112 428 128 C 410 124 400 140 406 165 Z" fill="#FDFCF8"/>
  <!-- interior hair shading strands -->
  <g fill="#DCE4EC">
    <path d="M 330 204 C 310 234 300 272 298 312 C 306 274 318 238 338 208 Z"/>
    <path d="M 470 204 C 490 234 500 272 502 312 C 494 274 482 238 462 208 Z"/>
    <path d="M 360 300 L 371 342 L 366 344 L 354 304 Z"/>
    <path d="M 438 298 L 429 340 L 434 342 L 444 302 Z"/>
    <path d="M 306 384 C 304 408 302 424 298 434 L 305 428 L 310 388 Z"/>
    <path d="M 494 384 C 496 408 498 424 502 434 L 495 428 L 490 388 Z"/>
