  <path d="M 276 246 C 264 212 261 180 266 152 C 292 170 314 192 328 214 C 312 228 294 240 276 246 Z" fill="#F5C4B4"/>
  <path d="M 532 262 C 550 214 554 168 546 128 C 508 150 476 180 456 214 C 482 236 508 252 532 262 Z" fill="#FDFCF8"/>
  <path d="M 524 246 C 536 212 539 180 534 152 C 508 170 486 192 472 214 C 488 228 506 240 524 246 Z" fill="#F5C4B4"/>

  <use xlink:href="#la-ears" transform="translate(1.5 0)"  stroke="#E0432E" opacity="0.55"/>
  <use xlink:href="#la-ears" transform="translate(-1.5 0)" stroke="#3F7CC4" opacity="0.55"/>
  <use xlink:href="#la-ears" stroke="#2B3A56"/>

  <!-- ===== ribbon ===== -->
  <path d="M 538 266 C 528 238 534 216 552 210 C 566 206 574 220 568 236 C 562 252 552 262 538 266 Z" fill="#24406E"/>
  <path d="M 542 270 C 570 258 592 260 598 274 C 602 288 588 298 570 292 C 558 288 548 280 542 270 Z" fill="#24406E"/>
  <path d="M 534 286 C 538 314 532 344 514 368 C 528 346 528 316 526 292 Z" fill="#1B3155"/>
  <path d="M 546 286 C 560 312 566 342 560 372 C 574 338 568 306 556 284 Z" fill="#24406E"/>
  <path d="M 528 262 C 538 254 550 256 554 266 C 558 278 550 288 538 288 C 526 288 522 270 528 262 Z" fill="#1B3155"/>

