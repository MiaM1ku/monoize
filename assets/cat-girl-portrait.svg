  <use xlink:href="#la-ribbon" transform="translate(-1.5 0)" stroke="#3F7CC4" opacity="0.55"/>
  <use xlink:href="#la-ribbon" stroke="#2B3A56"/>

  <!-- ===== white lily tucked into the ribbon ===== -->
  <g fill="#FFFFFF">
    <path d="M 572 222 C 564 200 564 176 574 158 C 584 174 586 200 578 222 Z" transform="rotate(-76 572 222)"/>
    <path d="M 572 222 C 564 200 564 176 574 158 C 584 174 586 200 578 222 Z" transform="rotate(76 572 222)"/>
    <path d="M 572 222 C 564 200 564 176 574 158 C 584 174 586 200 578 222 Z" transform="rotate(-38 572 222)"/>
    <path d="M 572 222 C 564 200 564 176 574 158 C 584 174 586 200 578 222 Z" transform="rotate(38 572 222)"/>
    <path d="M 572 222 C 564 200 564 176 574 158 C 584 174 586 200 578 222 Z"/>
  </g>
  <!-- stamens -->
  <g stroke="#E58A2E" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 572 220 C 568 206 564 196 557 188"/>
    <path d="M 573 219 C 573 205 574 194 576 184"/>
    <path d="M 574 220 C 580 207 586 198 592 191"/>
  </g>
  <g fill="#D97722">
    <ellipse cx="556" cy="186" rx="4.2" ry="2.8" transform="rotate(-35 556 186)"/>
    <ellipse cx="576" cy="182" rx="4.2" ry="2.8" transform="rotate(5 576 182)"/>
    <ellipse cx="593" cy="189" rx="4.2" ry="2.8" transform="rotate(40 593 189)"/>
