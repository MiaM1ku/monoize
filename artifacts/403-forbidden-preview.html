<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>403 SVG vs reference PNG</title>
<style>
  body { margin: 0; padding: 16px; background: #444; font: 14px sans-serif; color: #fff; }
  figure { margin: 0 0 24px; }
  figcaption { margin-bottom: 6px; }
  img { display: block; width: 935px; max-width: 100%; height: auto; background: #fff; }
</style>
</head>
<body>
<figure>
  <figcaption>Hand-written SVG</figcaption>
  <img src="403-forbidden.svg" alt="Hand-written SVG recreation">
</figure>
<figure>
  <figcaption>Reference PNG</figcaption>
  <img src="403-forbidden-reference.png" alt="Reference PNG">
</figure>
</body>
</html>
